# Reverse proxy for production: serves the Vite SPA and forwards
# same-origin /api/* + /health to the api service so HttpOnly
# SameSite=Lax session cookies work without CORS.
# Docker embedded DNS; resolving via variable keeps nginx working
# across api restarts without a reload.
resolver 127.0.0.11 valid=10s;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Uploads / design-file imports go through express.json (12mb limit).
  client_max_body_size 12m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml font/ttf;
  gzip_min_length 1024;

  # Long-cache hashed build assets; never cache the entry HTML / SW.
  location ~* \.(js|css|wasm)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /health {
    set $api http://api:3000;
    proxy_pass $api/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    set $api http://api:3000;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
  }

  # SPA fallback (Vue Router + PWA navigateFallback).
  location / {
    expires -1;
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}

# Production deployment for ZenuxsDesign / OpenPencil.
#
#   cp .env.example .env   # set ALLOWED_ORIGINS to your public origin
#   docker compose up --build -d
#   open http://<host>:${WEB_PORT:-80}  (health: /health via web)
#
# Dev workflow moved to docker-compose.dev.yml:
#   docker compose -f docker-compose.dev.yml up --build
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - app
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/zenuxs-desigen}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # Optional overrides (uncomment to set; when absent the server
      # falls back to its built-in defaults in packages/server/src/config.ts):
      # - ZENUXS_ISSUER=${ZENUXS_ISSUER}
      # - ZENUXS_CLIENT_ID=${ZENUXS_CLIENT_ID}
      # - SESSION_TTL_MS=${SESSION_TTL_MS}
      # - SESSION_RATE_LIMIT_MAX=${SESSION_RATE_LIMIT_MAX}
    networks:
      - app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - app
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mongo-data:

networks:
  app:
    driver: bridge

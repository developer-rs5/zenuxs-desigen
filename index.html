<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon-128.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111315" />
    <title>ZenuxsDesign</title>
    <style>
      :root {
        --loader-bg: #111315;
        --loader-fg: #F5F7FA;
        --loader-muted: #737A85;
        --loader-accent: #3B82F6;
      }
      html[data-theme='dark'] {
        --loader-bg: #111315;
        --loader-fg: #F5F7FA;
        --loader-muted: #737A85;
        --loader-accent: #3B82F6;
      }
      html[data-theme='light'] {
        --loader-bg: #F7F8FA;
        --loader-fg: #17191C;
        --loader-muted: #8A919B;
        --loader-accent: #2563EB;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --loader-bg: #F7F8FA;
          --loader-fg: #17191C;
          --loader-muted: #8A919B;
          --loader-accent: #2563EB;
        }
      }
      body { margin: 0; background: var(--loader-bg); }
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 9999;
        background: var(--loader-bg);
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }
      .boot-logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: var(--loader-accent);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 24px;
        font-weight: 700;
        animation: boot-pulse 2s ease-in-out infinite;
      }
      .boot-brand {
        font-size: 16px;
        font-weight: 600;
        color: var(--loader-fg);
        letter-spacing: -0.01em;
      }
      .boot-status {
        font-size: 12px;
        color: var(--loader-muted);
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.02); }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div id="boot-splash">
        <div class="boot-logo">Z</div>
        <div class="boot-brand">ZenuxsDesign</div>
        <div class="boot-status">Loading...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

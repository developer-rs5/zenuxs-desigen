    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#111315" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F8FA" />
    <title>ZenuxsDesign</title>
    <style>
      :root {
        --loader-bg: #111315;
        --loader-fg: #F5F7FA;
        --loader-muted: #737A85;
        --loader-accent: #3B82F6;
      }
      html[data-theme='dark'] {
        --loader-bg: #111315;
        --loader-fg: #F5F7FA;
        --loader-muted: #737A85;
        --loader-accent: #3B82F6;
      }
      html[data-theme='light'] {
        --loader-bg: #F7F8FA;
        --loader-fg: #17191C;
        --loader-muted: #8A919B;
        --loader-accent: #2563EB;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --loader-bg: #F7F8FA;
          --loader-fg: #17191C;
          --loader-muted: #8A919B;
          --loader-accent: #2563EB;
        }
      }
      body { margin: 0; background: var(--loader-bg); }

      /* ============ SPLASH ============ */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: var(--loader-bg);
        font-family: Inter, system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #boot-splash.splash-exit { opacity: 0; visibility: hidden; }

      /* ============ AnalyzingImage scan animation ============ */
      .boot-scan-wrap {
        position: relative;
        width: 72px;
        height: 72px;
        color: var(--loader-muted);
      }

      /* Base SVG — always visible, muted */
      .boot-scan-base {
        position: absolute;
        inset: 0;
      }
      .boot-scan-base svg {
        width: 100%;
        height: 100%;
      }

      /* Overlay SVG — accent color, clipped by sweep */
      .boot-scan-overlay {
        position: absolute;
        inset: 0;
        z-index: 2;
        background: var(--loader-bg);
        color: var(--loader-accent);
        clip-path: inset(0% 0% 0% 0%);
        animation: scan-clip 2.5s cubic-bezier(0.175, 0.885, 0.32, 1) 0.2s infinite;
      }
      .boot-scan-overlay svg {
        width: 100%;
        height: 100%;
      }

      /* Scan line bar — slides across */
      .boot-scan-bar {
        position: absolute;
        top: 0;
        left: 0;
        width: 7%;
        height: 100%;
        border-radius: 999px;
        background: var(--loader-accent);
        z-index: 3;
        transform: translateX(1400%);
        animation: scan-bar 2.5s cubic-bezier(0.175, 0.885, 0.32, 1) 0.2s infinite;
      }

      /* Loading line */
      .boot-line {
        position: relative;
        width: 64px;
        height: 2px;
        border-radius: 1px;
        background: var(--loader-muted);
        overflow: hidden;
        opacity: 0.4;
      }
      .boot-line::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: var(--loader-accent);
        border-radius: 1px;
        animation: line-slide 1.4s ease-in-out infinite;
      }

      /* Loading text */
      .boot-text {
        font-size: 11px;
        color: var(--loader-muted);
        letter-spacing: 0.08em;
        animation: text-pulse 2.4s ease-in-out infinite;
      }

      /* === Keyframes — exact AnalyzingImage timing === */
      @keyframes scan-clip {
        0%   { clip-path: inset(0% 0% 0% 0%); }
        60%  { clip-path: inset(0% 105% 0% 0%); }
        100% { clip-path: inset(0% 0% 0% 0%); }
      }
      @keyframes scan-bar {
        0%   { transform: translateX(1400%); }
        60%  { transform: translateX(-80%); }
        100% { transform: translateX(1400%); }
      }
      @keyframes line-slide {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(300%); }
      }
      @keyframes text-pulse {
        0%, 100% { opacity: 0.35; }
        50%      { opacity: 0.9; }
      }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        #boot-splash * { animation: none !important; }
        .boot-scan-overlay { clip-path: inset(0% 0% 0% 0%); }
        .boot-scan-bar { transform: translateX(-80%); }
      }
    </style>
  </head>

    <script>
      // Graceful exit: fade splash when Vue mounts into #app
      (function () {
        var splash = document.getElementById('boot-splash');
        var app = document.getElementById('app');
        if (!splash || !app) return;
        var done = false;

        function fade() {
          if (done) return;
          done = true;
          splash.classList.add('splash-exit');
          setTimeout(function () {
            if (splash.parentNode) splash.remove();
          }, 500);
        }

        try {
          var mo = new MutationObserver(function (records) {
            for (var i = 0; i < records.length; i++) {
              var added = records[i].addedNodes;
              for (var j = 0; j < added.length; j++) {
                if (added[j].nodeType === 1) { fade(); return; }
              }
            }
          });
          mo.observe(app, { childList: true, subtree: true });
          setTimeout(function () { mo.disconnect(); }, 120000);
        } catch (e) {}
      })();
    </script>
